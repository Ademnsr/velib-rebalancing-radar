version: 2

models:
  - name: dim_stations
    description: "Dimension station : une ligne par station, carte d'identite"
    columns:
      - name: station_id
        description: "Identifiant unique de la station"
        data_tests:
          - unique
          - not_null

  - name: fct_station_status
    description: "Historique enrichi des releves de statut, une ligne par photo"
    columns:
      - name: station_id
        description: "Cle vers dim_stations"
        data_tests:
          - relationships:
              arguments:
                to: ref('dim_stations')
                field: station_id