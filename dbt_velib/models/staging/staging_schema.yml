version: 2

models:
  - name: stg_stations
    description: "Referentiel nettoye des stations Velib, une ligne par station"
    columns:
      - name: station_id
        description: "Identifiant unique de la station"
        data_tests:
          - unique
          - not_null

  - name: stg_station_status
    description: "Historique deduplique des releves de statut des stations"
    columns:
      - name: is_renting
        description: "1 si la station permet de louer un velo, 0 sinon"
        data_tests:
          - accepted_values:
              arguments:
                values: [0, 1]
      - name: is_returning
        description: "1 si la station permet de rendre un velo, 0 sinon"
        data_tests:
          - accepted_values:
              arguments:
                values: [0, 1]